name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and development dependencies
        run: python -m pip install --upgrade pip '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest --cov=agentic_framework --cov-branch --cov-report=term-missing --cov-fail-under=90

  build:
    name: Build and validate distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install release tooling
        run: python -m pip install --upgrade pip '.[dev]'
      - name: Verify tag matches package version
        run: |
          package_version="$(python -c 'import agentic_framework; print(agentic_framework.__version__)')"
          test "$GITHUB_REF_NAME" = "v$package_version"
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate metadata and descriptions
        run: python -m twine check dist/*
      - name: Test installed wheel
        run: python scripts/installed_distribution_tests.py dist/*.whl
      - name: Exercise wheel in clean projects
        run: python scripts/release_acceptance.py dist/*.whl
      - name: Exercise source distribution in clean projects
        run: python scripts/release_acceptance.py dist/*.tar.gz
      - name: Upload distributions
        uses: actions/upload-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agentic-development-framework
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distributions with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
