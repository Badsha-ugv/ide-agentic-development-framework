[build-system]
requires = ["hatchling>=1.26,<1.32"]
build-backend = "hatchling.build"

[project]
name = "agentic-development-framework"
dynamic = ["version"]
description = "A local-first framework for agentic software development workflows."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Agentic Development Framework contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
]
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8.0,<9",
  "pytest-cov>=5.0,<8",
  "ruff>=0.8,<1",
  "twine>=5,<7",
]

[project.urls]
Homepage = "https://github.com/Badsha-ugv/ide-agentic-development-framework"
Repository = "https://github.com/Badsha-ugv/ide-agentic-development-framework"
Issues = "https://github.com/Badsha-ugv/ide-agentic-development-framework/issues"
Changelog = "https://github.com/Badsha-ugv/ide-agentic-development-framework/blob/main/CHANGELOG.md"

[project.scripts]
adt = "agentic_framework.cli:app"

[tool.hatch.version]
path = "src/agentic_framework/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_framework"]

[tool.hatch.build.targets.sdist]
include = [
  "/CHANGELOG.md",
  "/LICENSE",
  "/README.md",
  "/docs",
  "/pyproject.toml",
  "/scripts/release_acceptance.py",
  "/scripts/installed_distribution_tests.py",
  "/src",
  "/tests",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["agentic_framework"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

